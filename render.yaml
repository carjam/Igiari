services:
  - type: web
    name: igiari-backend
    runtime: python
    plan: free
    buildCommand: |
      python --version
      pip install --upgrade pip
      pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SITE_URL
        value: https://igiari.us
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER_PACK
        sync: false
      - key: STRIPE_PRICE_CASUAL_SUB
        sync: false
