services:
  - type: web
    name: igiari-backend
    runtime: python
    plan: free
    buildCommand: |
      python --version
      pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
