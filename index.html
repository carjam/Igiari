<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Igiari! — Fallacy Scanner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1 class="title">Igiari!</h1>
            <p class="subtitle">異議あり! — A fallacy scanner for text</p>
        </header>

        <div class="scan-section" id="scanSection">
            <div class="textarea-wrapper">
                <textarea 
                    id="textInput" 
                    class="text-input" 
                    placeholder="Paste text here to scan for logical fallacies..."
                    maxlength="4000"
                ></textarea>
                <div class="char-counter">
                    <span id="charCount">0</span> / 4,000
                </div>
            </div>

            <div class="controls">
                <button id="scanButton" class="btn btn-primary">
                    Scan for Fallacies
                </button>
                <button id="tryExampleButton" class="btn btn-secondary">
                    Try an Example
                </button>
            </div>

            <div id="loadingState" class="state-message loading-state hidden">
                Reading closely…
            </div>

            <div id="errorState" class="state-message error-state hidden">
                <span id="errorMessage"></span>
            </div>
        </div>

        <div id="resultsSection" class="results-section hidden">
            <div class="results-header">
                <h2 class="results-title">Analysis</h2>
                <button id="resetButton" class="btn btn-text">Scan Another Text</button>
            </div>

            <div id="noFallaciesState" class="state-message success-state hidden">
                No fallacies found — this reasoning holds up.
            </div>

            <div id="annotatedText" class="annotated-text"></div>

            <div id="findingsList" class="findings-list"></div>
        </div>

        <footer class="footer">
            <p class="privacy-notice">
                Pasted text is sent to Anthropic's API for analysis. 
                We don't store your text beyond basic rate limiting.
            </p>
            <p class="footer-links">
                <a href="https://github.com/carjam/Igiari" target="_blank" rel="noopener">GitHub</a>
            </p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
